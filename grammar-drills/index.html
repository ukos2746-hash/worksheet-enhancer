<style>
/* Layout: sticky app bar → hero → category groups of a 4-col card grid; topic opens as a full drill screen with one question card at a time */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --line:#e4e7ee; --fg:#14161c; --muted:#5d6472; --soft:#8a90a0;
  --teal:#18788a; --teal-bg:#e2f2f5; --plum:#6a3c8f; --plum-bg:#f1e7f7;
  --ink:#2b2f6b; --ok:#1f8a53; --ok-bg:#e3f4ea; --rec:#d23b3b; --rec-bg:#fdeaea;
  --mark:#fff1b8; --mark-fg:#14161c;
  --shadow:0 1px 2px rgba(20,22,40,.05),0 4px 14px rgba(20,22,40,.05);
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318; --surface:#1a1d24; --line:#2b2f3a; --fg:#eef0f5; --muted:#a3a9b8; --soft:#7d8494;
  --teal:#5cc3d4; --teal-bg:#173239; --plum:#c79ae6; --plum-bg:#2d2238;
  --ink:#8f95f0; --ok:#5fd394; --ok-bg:#183326; --rec:#ff6b6b; --rec-bg:#3a1c1e;
  --mark:#4a3f12; --mark-fg:#fff3c4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1a1d24; --line:#2b2f3a; --fg:#eef0f5; --muted:#a3a9b8; --soft:#7d8494;
  --teal:#5cc3d4; --teal-bg:#173239; --plum:#c79ae6; --plum-bg:#2d2238;
  --ink:#8f95f0; --ok:#5fd394; --ok-bg:#183326; --rec:#ff6b6b; --rec-bg:#3a1c1e;
  --mark:#4a3f12; --mark-fg:#fff3c4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:28px}
@media (max-width:640px){.wrap{padding-inline:16px}}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.logo{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,#1d5f88 0%,#3b3f8f 55%,#6a3c8f 100%)}
.logo svg{width:22px;height:22px}
.brand{min-width:0;flex:1}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--soft)}
.prog{text-align:right;min-width:96px}
.prog small{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.prog b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.track{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.track i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
@media (max-width:560px){.brand span{display:none}.btn .lbl{display:none}.prog{min-width:70px}}

/* hero */
.hero{padding-block:44px 22px}
h1{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance;line-height:1.15}
.lead{color:var(--muted);max-width:64ch;margin:0 0 14px;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}

/* category groups + grid */
.group{padding-block:14px 8px}
.group h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1020px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;min-height:138px;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--soft)}
.card .em{font-size:26px;line-height:1}
.card h3{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
.card .chips{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip.t{background:var(--teal-bg);color:var(--teal)}
.chip.p{background:var(--plum-bg);color:var(--plum)}
.chip.g{background:var(--ok-bg);color:var(--ok)}
.card .done{position:absolute;top:16px;right:16px;font-size:11.5px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
footer{padding-block:30px 40px;color:var(--soft);font-size:12.5px}

/* drill screen */
.drill{padding-block:22px 60px}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:6px 0;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--fg)}
.dhead{display:flex;gap:14px;align-items:flex-start;margin:10px 0 18px}
.dhead .em{font-size:38px;line-height:1}
.dhead h1{margin:0 0 4px}
.dhead p{margin:0;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.instr{margin:0 0 12px;font-size:14.5px}
.formula{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 8px;overflow-x:auto}
.formula b,.qt b{font-weight:800}
.formula i{font-style:normal;font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--plum)}
.ex{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.ex li{margin:2px 0}
.side{display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){.side{display:contents}.panel.task{order:-1}.mainc{order:0}.panel.auto{order:1}}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab .n{opacity:.7;font-weight:600;margin-left:4px}

.qcard{scroll-margin-top:84px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 26px 20px;display:flex;flex-direction:column;gap:18px}
@media (max-width:560px){.qcard{padding:20px 16px 16px}}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qmeta .num{font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums}
.sec{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--plum);background:var(--plum-bg);border-radius:6px;padding:3px 8px}
.secf{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--muted)}
.qbody{position:relative;min-height:120px;display:flex;align-items:center}
.qt{font-size:clamp(21px,2.6vw,27px);font-weight:600;line-height:1.38;letter-spacing:-.01em;margin:0;text-wrap:pretty}
.qt b{background:var(--mark);color:var(--mark-fg);border-radius:4px;padding:0 3px;font-weight:700}
.qt.hidden{filter:blur(10px);user-select:none;opacity:.18}
.reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;flex-direction:column;text-align:center}
.reveal .ear{font-size:30px}
.reveal button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow)}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.play{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:14px;padding:12px 20px 12px 14px;font-weight:800;font-size:15px;background:var(--ink);color:#fff}
.play .ic{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.play.playing .ic{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,255,255,.12)}}
.ctl{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
.ctl:hover{border-color:var(--soft)}
.ctl.rec{color:var(--rec)}
.ctl.rec.on{background:var(--rec-bg);border-color:var(--rec)}
.ctl.ok.on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.ctl[disabled]{opacity:.45;cursor:not-allowed}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--rec)}
.on .recdot{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.note{font-size:13px;color:var(--muted);margin:0}
.note.warn{color:var(--rec)}
.myans{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.myans audio{height:36px;max-width:100%}

.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;flex:1;min-width:0}
.dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--line)}
.dots button.d{background:var(--ok)}
.dots button.c{outline:2px solid var(--ink);outline-offset:1px}

.auto{display:flex;flex-direction:column;gap:10px}
.auto .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.timer{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:0;background:var(--teal)}
.countdown{font-weight:800;font-variant-numeric:tabular-nums;color:var(--teal)}

.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.li .n{font-weight:800;color:var(--soft);font-variant-numeric:tabular-nums;min-width:22px;padding-top:2px}
.li .t{flex:1;min-width:0;font-size:16px}
.li .t b{background:var(--mark);color:var(--mark-fg);border-radius:4px;padding:0 3px}
.lreveal{border:1px dashed var(--line);background:var(--bg);color:var(--muted);border-radius:10px;padding:5px 12px;font-weight:600;font-size:13.5px}
.lreveal:hover{color:var(--fg);border-color:var(--soft)}
.li .mini{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.li.d .n{color:var(--ok)}
.viewsw{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:50;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:440px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 14px;font-size:19px;font-weight:800}
.guideBtn{margin-top:22px;width:100%;display:flex;align-items:center;gap:16px;text-align:left;border:0;border-radius:18px;padding:18px 22px;
  background:linear-gradient(120deg,#1d5f88 0%,#3b3f8f 55%,#6a3c8f 100%);color:#fff;box-shadow:var(--shadow);transition:transform .15s}
.guideBtn:hover{transform:translateY(-2px)}
.guideBtn .gi{font-size:30px;line-height:1;flex:none}
.guideBtn b{display:block;font-size:clamp(17px,2.2vw,21px);font-weight:800;letter-spacing:-.01em;line-height:1.25}
.guideBtn small{display:block;font-size:13.5px;opacity:.85;margin-top:3px}
.guideBtn .arr{margin-left:auto;font-size:22px;flex:none}
.dlg.wide{max-width:720px;padding:26px 28px}
@media (max-width:560px){.dlg.wide{padding:20px 18px}}
.guide h4{font-size:16px;font-weight:800;margin:20px 0 8px}
.guide p,.guide li{font-size:15px;line-height:1.6;max-width:68ch}
.guide p{margin:0 0 10px}
.guide ol,.guide ul{margin:0 0 10px;padding-left:22px}
.guide li{margin:4px 0}
.guide .lead2{font-size:16px}
.guide em{font-style:normal;background:var(--mark);color:var(--mark-fg);border-radius:4px;padding:0 3px}
.guide .tip{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0 4px}
.gtabs{display:flex;gap:8px;margin:0 0 16px}
.dlghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:none;font-size:22px;color:var(--muted);padding:4px 8px;border-radius:8px}
.x:hover{color:var(--fg)}
.myans a{font-size:13px;font-weight:700;color:var(--ink)}
.vopt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.vopt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.vopt .fl{font-size:22px}
.vopt b{display:block}
.vopt small{color:var(--muted)}
.vopt .try{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ink)}
.dlg .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:16px 0 8px;font-weight:700}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.dlg .close{margin-top:18px;width:100%;justify-content:center;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

d/might have** + [past participle]"}],"instr":""}],"instr":"Mixed conditionals express hypothetical situations where the time of the condition and the time of the result are different. Answer using the mixed conditional structure, then explain your answer.","formulas":[],"examples":[]},{"id":"wish-if-only","cat":"cond","emoji":"🌠","title":"Wish & If only","ru":"Сожаления о настоящем и прошлом","sets":[{"label":"Набор 1","q":[{"id":"wish-if-only-1-1","t":"You don't have enough money to go to Japan with your friends.","sec":"PRESENT WISHES","secf":"**wish/if only** + [past tense]"},{"id":"wish-if-only-1-2","t":"You like your job and the money you make, but you don't have enough free time.","sec":"PRESENT WISHES","secf":"**wish/if only** + [past tense]"},{"id":"wish-if-only-1-3","t":"You want to get healthier, but you are too busy to work out.","sec":"PRESENT WISHES","secf":"**wish/if only** + [past tense]"},{"id":"wish-if-only-1-4","t":"You enjoy living near the ocean, but the rent is too high.","sec":"PRESENT WISHES","secf":"**wish/if only** + [past tense]"},{"id":"wish-if-only-1-5","t":"You want to learn how to make clothes, but you can't find the time.","sec":"PRESENT WISHES","secf":"**wish/if only** + [past tense]"},{"id":"wish-if-only-1-6","t":"You would like to study English more, but you feel too tired after work or school.","sec":"PRESENT WISHES","secf":"**wish/if only** + [past tense]"},{"id":"wish-if-only-1-7","t":"You feel that you spend too much time on your phone.","sec":"PRESENT WISHES","secf":"**wish/if only** + [past tense]"},{"id":"wish-if-only-1-8","t":"You want to read more books, but you are always distracted by other things.","sec":"PRESENT WISHES","secf":"**wish/if only** + [past tense]"},{"id":"wish-if-only-1-9","t":"You want to be more confident, but you worry too much about making mistakes.","sec":"PRESENT WISHES","secf":"**wish/if only** + [past tense]"},{"id":"wish-if-only-1-10","t":"You chose the shortest line at the supermarket, but it moved the slowest.","sec":"PAST REGRETS","secf":"**wish/if only** + [past perfect tense]"},{"id":"wish-if-only-1-11","t":"You sent a message complaining about your class or job to your teacher or boss by mistake.","sec":"PAST REGRETS","secf":"**wish/if only** + [past perfect tense]"},{"id":"wish-if-only-1-12","t":"You didn't check your flight or train ticket carefully, so you missed the trip.","sec":"PAST REGRETS","secf":"**wish/if only** + [past perfect tense]"},{"id":"wish-if-only-1-13","t":"You kept putting off an important task, so you had to finish it all in one stressful night.","sec":"PAST REGRETS","secf":"**wish/if only** + [past perfect tense]"},{"id":"wish-if-only-1-14","t":"You ordered food, but your family told you they were already cooking dinner.","sec":"PAST REGRETS","secf":"**wish/if only** + [past perfect tense]"},{"id":"wish-if-only-1-15","t":"You wore a heavy sweater, but the weather turned warm and sunny.","sec":"PAST REGRETS","secf":"**wish/if only** + [past perfect tense]"},{"id":"wish-if-only-1-16","t":"You paid full price for a jacket, but it went on sale the next day.","sec":"PAST REGRETS","secf":"**wish/if only** + [past perfect tense]"},{"id":"wish-if-only-1-17","t":"You were too nervous to ask questions, so you misunderstood the assignment.","sec":"PAST REGRETS","secf":"**wish/if only** + [past perfect tense]"},{"id":"wish-if-only-1-18","t":"You got angry in an argument and said something hurtful.","sec":"PAST REGRETS","secf":"**wish/if only** + [past perfect tense]"}],"instr":"Wish is used to talk about a situation you want to be different. If only is similar and can sound stronger or more emotional. React to each situation with wish or if only. Then add one more sentence to explain your answer."}],"instr":"Wish is used to talk about a situation you want to be different. If only is similar and can sound stronger or more emotional. React to each situation with wish or if only. Then add one more sentence to explain your answer.","formulas":["  boring person?"},{"id":"would-you-rather-2-30","t":"**Would you rather** find a chest of gold or be given a lot of Bitcoin?"}],"instr":"Answer with I would rather… or I'd rather… and explain why using would or could."}],"instr":"Answer the following difficult questions. Use I would rather or I'd rather and continue to use would or could to explain the imagined (unreal) situation.","formulas":["I would rather / I'd rather + [verb]… because I would/could…"],"examples":[]},{"id":"can-be-able-to","cat":"modals","emoji":"💪","title":"Can / be able to","ru":"Умения и возможности","sets":[{"label":"Набор 1","q":[{"id":"can-be-able-to-1-1","t":"**Can** you ride a bicycle?"},{"id":"can-be-able-to-1-2","t":"**Can** you swim?"},{"id":"can-be-able-to-1-3","t":"**Can** you write your name without looking at the paper? **Can** you do it with your left hand?"},{"id":"can-be-able-to-1-4","t":"**Can** you stand on one foot for more than 30 seconds?"},{"id":"can-be-able-to-1-5","t":"**Can** you hold your breath for a minute?"},{"id":"can-be-able-to-1-6","t":"**Can** you remember their names when you meet new people?"},{"id":"can-be-able-to-1-7","t":"**Can** you cook anything delicious?"},{"id":"can-be-able-to-1-8","t":"**Can** anyone you know fly a plane?"},{"id":"can-be-able-to-1-9","t":"**Can** you tell if it will rain soon? How do you know?"},{"id":"can-be-able-to-1-10","t":"**Can** you sing?"},{"id":"can-be-able-to-1-11","t":"What **can** you do better than other people?"},{"id":"can-be-able-to-1-12","t":"What kind of human behavior **can't** you understand?"},{"id":"can-be-able-to-1-13","t":"What **can't** you do at all?"},{"id":"can-be-able-to-1-14","t":"What food **can't** you eat? Why **can't** you eat it?"},{"id":"can-be-able-to-1-15","t":"What **can** you draw?"},{"id":"can-be-able-to-1-16","t":"Why **can't** you slam dunk a basketball? Or **can** you?"},{"id":"can-be-able-to-1-17","t":"Why **can't** you get perfect scores on every test and exam?"},{"id":"can-be-able-to-1-18","t":"Who **can** you trust?"},{"id":"can-be-able-to-1-19","t":"Who in your life **can** you go to for advice?"},{"id":"can-be-able-to-1-20","t":"When **can** you sleep? **Can** you sleep at any time?"},{"id":"can-be-able-to-1-21","t":"Where **can** you fall asleep? Do you have to be in your own bed?"},{"id":"can-be-able-to-1-22","t":"Where **can** we see beautiful scenery?"},{"id":"can-be-able-to-1-23","t":"Where **can** I go to get a bargain?"},{"id":"can-be-able-to-1-24","t":"How **can** a person be safe if they are outside at night?"},{"id":"can-be-able-to-1-25","t":"How **can** I get to a convenience store from here?"},{"id":"can-be-able-to-1-26","t":"How **can** we know when a dog is happy or sad?"},{"id":"can-be-able-to-1-27","t":"How **can** I learn English more quickly?"}],"instr":"Answer the following questions using can (ability). Vary your language occasionally with be able to. Try to continue each conversation naturally."}],"instr":"Answer the following questions using can (ability). Vary your language occasionally with be able to. Try to continue each conversation naturally.","formulas":["[subject] + can/can't + [verb]","[subject] + am/is/are able to + [verb]"],"examples":[]},{"id":"should-ought-to","cat":"modals","emoji":"🧭","title":"Should / ought to / had better","ru":"Советы и рекомендации: should, ought to, had better","sets":[{"label":"Ситуации: дай совет","q":[{"id":"should-ought-to-1-1","t":"I want to learn to drive, but my father makes me feel nervous when he tries to teach me. Please give me some advice."},{"id":"should-ought-to-1-2","t":"I have a part-time job which pays me good money. However, I'm too tired to study and my grades are getting worse. What **should** I do?"},{"id":"should-ought-to-1-3","t":"I think the girl I'm dating is going to break up with me. I like her, but she doesn't seem to like me. Do you have any advice?"},{"id":"should-ought-to-1-4","t":"I want to be healthy, but healthy food seems expensive. What advice can you onversation naturally if you can."},{"label":"Вопросы","instr":"Answer each question using should, ought to or had better. Then explain your advice.","q":[{"id":"should-ought-to-2-1","t":"Where **should** I go on my next vacation?"},{"id":"should-ought-to-2-2","t":"What **should** a person look for when dating?"},{"id":"should-ought-to-2-3","t":"**Should** a husband and wife share household chores? Why or why not?"},{"id":"should-ought-to-2-4","t":"What are some things a person **ought to** do to get a good job?"},{"id":"should-ought-to-2-5","t":"What are two things a person **ought to** do to have a happy life?"},{"id":"should-ought-to-2-6","t":"What are some things a person **had better** or **had better not** do during a job interview?"},{"id":"should-ought-to-2-7","t":"What are some things **I'd better not** do if I want to live a long time?"},{"id":"should-ought-to-2-8","t":"Who are some musicians or bands I **ought to** listen to?"},{"id":"should-ought-to-2-9","t":"Where **should** I go to buy electronics?"},{"id":"should-ought-to-2-10","t":"**Should** the work week be four days instead of five? Why or why not?"},{"id":"should-ought-to-2-11","t":"What's something every person **should** do before they die?"},{"id":"should-ought-to-2-12","t":"What are two things a person **ought to** do if they visit your country?"},{"id":"should-ought-to-2-13","t":"Are there any things a tourist **had better not** do if they visit your country?"},{"id":"should-ought-to-2-14","t":"How old **should** a person be before they can buy cigarettes? How about alcohol?"},{"id":"should-ought-to-2-15","t":"What are some things parents **had better** teach their children?"},{"id":"should-ought-to-2-16","t":"What's something that isn't a law but **should** be?"},{"id":"should-ought-to-2-17","t":"What's one thing everyone **ought to** study?"},{"id":"should-ought-to-2-18","t":"What are some things **I'd better** do when traveling abroad?"}]}],"instr":"Respond to the following prompts using should and ought to (advice). Continue each conversation naturally if you can.","formulas":["You should / ought to + [verb]","You shouldn't + [verb]","You'd better (not) + [verb]"],"examples":[]},{"id":"must-have-to","cat":"modals","emoji":"📋","title":"Must / have to","ru":"Необходимость и обязанность: must, have to, must not","sets":[{"label":"Набор 1","instr":"","q":[{"id":"must-have-to-1-1","t":"What are some things you **have to** do when you get home?"},{"id":"must-have-to-1-2","t":"What are some things you **must** do or **must not** do when you go to the airport?"},{"id":"must-have-to-1-3","t":"What do students **have to** do if they want to improve their English?"},{"id":"must-have-to-1-4","t":"What are some unusual or harsh laws in your country?"},{"id":"must-have-to-1-5","t":"Which types of workers **have to** work the hardest?"},{"id":"must-have-to-1-6","t":"What are some things you **must** or **must not** do at your job or university?"},{"id":"must-have-to-1-7","t":"Is there anywhere you **have to** go after class?"},{"id":"must-have-to-1-8","t":"What does a person **have to** do to become successful?"},{"id":"must-have-to-1-9","t":"What are some things you **have to** do but don't want to?"},{"id":"must-have-to-1-10","t":"What **must** a person do to be happy?"},{"id":"must-have-to-1-11","t":"Who is someone you **must** listen to?"},{"id":"must-have-to-1-12","t":"What are some interesting customs in your country that people **have to** follow?"},{"id":"must-have-to-1-13","t":"Where **must** you go even though you don't want to?"},{"id":"must-have-to-1-14","t":"How many hours of sleep do you **have to** get to function normally?"},{"id":"must-have-to-1-15","t":"Is there anything that you **have to** eat at least once a week?"},{"id":"must-have-to-1-16","t":"What are two things your parents said you **must** do?"},{"id":"must-have-to-1-17","t":"What are some things all humans **have to** work together to accomplish?"}]}],"instr":"Answer each question using must, must not, have to or don't have to. Then explain your answer.","formulas":["[subject] + must / must not + [verb]","[subject] + have to / has to + [verb]","[subject] + don't / doesn't have to + [verb] (не обязательно)"],"examples":[]},{"id":"may-might-could","cat":"modals","emoji":"🎲","title":"May / might / could","ru":"Возможность и предположения: may, might, could, must, can't","sets":[{"label":"Набор 1","instr":"","q":[{"id":"may-might-could-1-1","t":"What are some things you **may** do this evening?"},{"id":"may-might-could-1-2","t":"What are three good things that **may** happen soon in your life?"},{"id":"may-might-could-1-3","t":"Is there anything you **can't** do even though you want to?"},{"id":"may-might-could-1-4","t":"What movie **might** win the Academy Award for best picture this year?"},{"id":"may-might-could-1-5","t":"Is there anything that **could** make you change your major or quit your job?"},{"id":"may-might-could-1-6","t":"Where **might** you be living in 5 years?"},{"id":"may-might-could-1-7","t":"What are two things that **could** make you much happier?"},{"id":"may-might-could-1-8","t":"What are some goals you **might** accomplish in the future?"},{"id":"may-might-could-1-9","t":"In what ways do you think your country **may** improve in the future?"},{"id":"may-might-could-1-10","t":"What are three things all humans **must** learn to do better?"},{"id":"may-might-could-1-11","t":"What are some problems the world **might** face in the future?"},{"id":"may-might-could-1-12","t":"What are some things that **could** improve the economy in your country?"},{"id":"may-might-could-1-13","t":"Do you think that aliens exist? Why or why not?","sec":"How certain are you?","secf":"Talk about how certain you are of your opinion using modals: **must** / **can't** (почти уверен) · **may** / **might** / **could** (возможно)"},{"id":"may-might-could-1-14","t":"Do you think that people are born good, evil, or neutral? Why?","sec":"How certain are you?","secf":"Talk about how certain you are of your opinion using modals: **must** / **can't** (почти уверен) · **may** / **might** / **could** (возможно)"},{"id":"may-might-could-1-15","t":"Talk about some conspiracies you've heard. Do you believe them or not?","sec":"How certain are you?","secf":"Talk about how certain you are of your opinion using modals: **must** / **can't** (почти уверен) · **may** / **might** / **could** (возможно)"},{"id":"may-might-could-1-16","t":"Do you think that most politicians start their careers with good intentions?","sec":"How certain are you?","secf":"Talk about how certain you are of your opinion using modals: **must** / **can't** (почти уверен) · **may** / **might** / **could** (возможно)"},{"id":"may-might-could-1-17","t":"What do you think made people stop hunting and gathering, and start farming?","sec":"How certain are you?","secf":"Talk about how certain you are of your opinion using modals: **must** / **can't** (почти уверен) · **may** / **might** / **could** (возможно)"}]}],"instr":"Answer each question using may, might or could to talk about possibility. Then explain your answer.","formulas":["[subject] + may / might / could + [verb]","[subject] + may / might / could + be + [verb]-ing"],"examples":[]},{"id":"past-modals","cat":"modals","emoji":"🤦","title":"Past Modals","ru":"Should have / could have / might have — о прошлом","sets":[{"label":"Набор 1","q":[{"id":"past-modals-1-1","t":"You went to bed at 3am last night, and this morning you slept past your alarm, which made you late for work."},{"id":"past-modals-1-2","t":"Deedee studied all night for a test, and while doing the test, she fell asleep and didn't finish."},{"id":"past-modals-1-3","t":"Hakim forgot to put his phone on silent and it rang loudly during a meeting."},{"id":"past-modals-1-4","t":"You sent an email too fast and realized you attached a photo of yourself instead of the correct file."},{"id":"past-modals-1-5","t":"You missed your flight because you left home thirty minutes late."},{"id":"past-modals-1-6","t":"You stepped into the road without looking, and a bus just missed you."},{"id":"past-modals-1-7","t":"When Harold tried to put his new TV on a TV stand, he dropped it and it cracked."},{"id":"past-modals-1-8","t":"You saw an old friend from school, but you didn't say anything because you couldn't remember their name."},{"id":"past-modals-1-9","t":"You talked to an interesting, attractive person at a party, but you didn't exchange contact information."},{"id":"past-modals-1-10","t":"You made a joke that didn't work, and the mood got awkward."},{"id":"past-modals-1-11","t":"Your date left early; you think you said the wrong thing."},{"id":"past-modals-1-12","t":"Sophia took her dog into a store, and the dog knocked over a vase that cost $1000."},{"id":"past-modals-1-13","t":"Donny shared a secret with James, and the next day, everyone knew about it."},{"id":"past-modals-1-14","t":"Layla ignored pain in her tooth for weeks, and it got really bad."},{"id":"past-modals-1-15","t":"You clicked a suspicious link and now your computer seems strange."},{"id":"past-modals-1-16","t":"You posted a comment online while angry and regretted it later."},{"id":"past-modals-1-17","t":"You lost your wallet, but you don't know if you dropped it or it was stolen."},{"id":"past-modals-1-18","t":"In 2020, you considered buying Nvidia stock, but you bought an expensive sofa instead."}],"instr":""}],"instr":"These modal phrases help you talk about a past situation and imagine a different action or result. Use each expression at least once to respond to the situations below.","formulas":["[subject] + **should have** + [past participle]","[subject] + **could have** + [past participle]","[subject] + **might have** + [past participle]"],"examples":["I should have gone to bed earlier.","I could have set two alarms.","I might have been on time if I'd gone to bed earlier."]},{"id":"passive-voice","cat":"passive","emoji":"🏗️","title":"Passive Voice","ru":"Важно действие, а не кто его совершил","sets":[{"label":"Разные времена","q":[{"id":"passive-voice-1-1","t":"What **have** you **been given** lately?"},{"id":"passive-voice-1-2","t":"**Have** you or a friend ever **been attacked** or **robbed**? What happened?"},{"id":"passive-voice-1-3","t":"Why does your hair look like that? What **was done** to it?"},{"id":"passive-voice-1-4","t":"**Have** you ever **been recorded** with an audio or video recorder? What were you doing?"},{"id":"passive-voice-1-5","t":"What condition is your home in? When **was** it **built**? What **has been done** to it lately? **Has** it **been damaged**?"},{"id":"passive-voice-1-6","t":"What **is** usually **eaten** for breakfast in your country?"},{"id":"passive-voice-1-7","t":"What **is** usually **consumed** at parties in your city?"},{"id":"passive-voice-1-8","t":"What **could be done** to this room to make it nicer?"},{"id":"passive-voice-1-9","t":"What **will be said** about you when you are gone? What do you hope **will be said**?"},{"id":"passive-voice-1-10","t":"**Are** teenagers **given** too much freedom these days? Do they need to **be controlled**?"},{"id":"passive-voice-1-11","t":"What **should be done** about air and water pollution?"},{"id":"passive-voice-1-12","t":"What do you like to **be called** by friends? What **are** you **called** by your family?"},{"id":"passive-voice-1-13","t":"**Has** your English ability **been tested** lately? How **was** it **tested**?"},{"id":"passive-voice-1-14","t":"**Have** your teeth **been checked** by a dentist recently? If so, what condition were they in? If not, why not? When was your last check-up?"},{"id":"passive-voice-1-15","t":"Some people think the moon landing **was faked**. What do you think?"},{"id":"passive-voice-1-16","t":"You leave something that you plan on eating in your fridge, but later you find that it is gone. Who **was** it probably **eaten** by?"},{"id":"passive-voice-1-17","t":"A hungry man steals a loaf of bread. How **should** he **be punished**?"}],"instr":""},{"label":"Present Simple Passive","instr":"Answer using the present simple passive: am/is/are + past participle. For example: The best watches are made in Switzerland.","q":[{"id":"passive-voice-2-1","t":"Where **are** the best suits **made**?"},{"id":"passive-voice-2-2","t":"Who **are** the best cell phones **made** by?"},{"id":"passive-voice-2-3","t":"Where **are** the worst cars **made**?"},{"id":"passive-voice-2-4","t":"Where **is** most of the world's oil **extracted**?"},{"id":"passive-voice-2-5","t":"What is the process to make a great wine?"},{"id":"passive-voice-2-6","t":"Where **are** the best football players **born**?"},{"id":"passive-voice-2-7","t":"Where **are** most technical advances **made**?"},{"id":"passive-voice-2-8","t":"Where **are** the best watches **made**?"},{"id":"passive-voice-2-9","t":"Who **are** the best TVs **made** by?"},{"id":"passive-voice-2-10","t":"What do you know the process for making? What are the steps for making it?"},{"id":"passive-voice-2-11","t":"In what country **is** football **played** most?"},{"id":"passive-voice-2-12","t":"Who **are** the best films **directed** by?"},{"id":"passive-voice-2-13","t":"Where **are** most computers **made**?"},{"id":"passive-voice-2-14","t":"Who **are** the best shoes **made** by?"},{"id":"passive-voice-2-15","t":"Who **are** the best cars **made** by?"},{"id":"passive-voice-2-16","t":"What sports **are** **played** most in your country?"},{"id":"passive-voice-2-17","t":"Where **is** the best tea **grown**?"},{"id":"passive-voice-2-18","t":"Where **are** the best games **created**?"}]},{"label":"Past Simple Passive","instr":"Answer using the past simple passive: was/were + past participle. For example: My phone was made by Samsung.","q":[{"id":"passive-voice-3-1","t":"Who **were** your clothes **made** by?"},{"id":"passive-voice-3-2","t":"Have you ever **had** anything **stolen** from you?"},{"id":"passive-voice-3-3","t":"Who **was** your phone **made** by?"},{"id":"passive-voice-3-4","t":"Who **were** your shoes **made** by?"},{"id":"passive-voice-3-5","t":"Where **were** you **born**? **Were** you **raised** there, too?"},{"id":"passive-voice-3-6","t":"What's your favorite book? Who **was** it **written** by?"},{"id":"passive-voice-3-7","t":"What's your favorite song? Who **was** it **sung** by?"},{"id":"passive-voice-3-8","t":"What's your favorite movie? Who **was** it **directed** by?"},{"id":"passive-voice-3-9","t":"Talk about when you **were given** bad service at a restaurant."},{"id":"passive-voice-3-10","t":"Where **were** you first **exposed** to English?"},{"id":"passive-voice-3-11","t":"Who **was** your favorite game **made** by?"},{"id":"passive-voice-3-12","t":"Who **were** the best plays **written** by?"},{"id":"passive-voice-3-13","t":"Who **were** the greatest symphonies **composed** by?"},{"id":"passive-voice-3-14","t":"In what country **were** the greatest works of art **created**?"},{"id":"passive-voice-3-15","t":"What's the greatest invention? Who **was** it **invented** by? Where **was** it **invented**?"},{"id":"passive-voice-3-16","t":"What's the most important building in your country's history? Who **was** it **built** by? When **was** it **built**?"},{"id":"passive-voice-3-17","t":"What is the most mysterious monument from your country's history? What do you think it **was used** for? When **was** it **made**?"}]}],"instr":"Use the passive voice in your answers when the action is more important than who did it.","formulas":["[subject] + **be** + [past participle]"],"examples":["I was given a gift yesterday.","My apartment was built in 2010.","English is spoken in many countries."]},{"id":"causative","cat":"passive","emoji":"💇","title":"Causative: have/get something done","ru":"Когда что-то делают для тебя другие","sets":[{"label":"Набор 1","q":[{"id":"causative-1-1","t":"Do you still **get** photos **developed** and printed?"},{"id":"causative-1-2","t":"When was the last time you **had** dinner **cooked** for you?"},{"id":"causative-1-3","t":"How often do you **have** your teeth **checked** by a dentist?"},{"id":"causative-1-4","t":"Is there grass at your house? Do you **have** your lawn **mowed**?"},{"id":"causative-1-5","t":"How often do you **have** clothes **dry-cleaned**?"},{"id":"causative-1-6","t":"Where do you go to **get** your hair **cut**?"},{"id":"causative-1-7","t":"Have you **had** your fortune **told**? Talk about it."},{"id":"causative-1-8","t":"Would you like to **have** your house professionally **cleaned**?"},{"id":"causative-1-9","t":"Do you **get** your health **checked** regularly? Why or why not?"},{"id":"causative-1-10","t":"When was the last time you **had** your photo **taken** professionally?"},{"id":"causative-1-11","t":"Do you **get** your nails **done**? Where?"},{"id":"causative-1-12","t":"Do you **have** your windows **washed** or do you wash them yourself?"},{"id":"causative-1-13","t":"How often should a car owner **have** their car **checked** by a mechanic?"},{"id":"causative-1-14","t":"How often do you **have** packages **delivered** to your home?"},{"id":"causative-1-15","t":"What was the result the last time that you **had** your eyesight **checked**?"},{"id":"causative-1-16","t":"Which piece of clothing would you like to **have made** for you?"},{"id":"causative-1-17","t":"Have you ever **had** your heart **broken**?"}],"instr":""}],"instr":"Use the causative passive in your answers to talk about arranging for other people to do things:","formulas":["[subject] + **have/get** + [object] + [past participle]"],"examples":["I had my hair cut yesterday.","We get our lawn mowed by professional gardeners."]},{"id":"verb-gerund","cat":"patterns","emoji":"🎯","title":"Verb + Gerund","ru":"Глаголы, после которых нужен -ing: enjoy, mind, avoid…","sets":[{"label":"Набор 1","q":[{"id":"verb-gerund-1-1","t":"What do you **enjoy** doing?"},{"id":"verb-gerund-1-2","t":"Would you **mind** helping me move house?"},{"id":"verb-gerund-1-3","t":"I want to eat something spicy. What do you **suggest**?"},{"id":"verb-gerund-1-4","t":"How do you know when it is time to **stop** eating?"},{"id":"verb-gerund-1-5","t":"If you were offered a job with high pay and no vacation time and a job with low pay and lots of vacation time, which one would you **consider** taking?"},{"id":"verb-gerund-1-6","t":"What do you **appreciate** having studied at school?"},{"id":"verb-gerund-1-7","t":"Can you **imagine** being a different person or an animal?"},{"id":"verb-gerund-1-8","t":"What do you **miss** from your childhood?"},{"id":"verb-gerund-1-9","t":"In your town or city, is there an area that you **avoid** going to? Why?"},{"id":"verb-gerund-1-10","t":"I would like to listen to a new band or singer. Who can you **recommend**?"},{"id":"verb-gerund-1-11","t":"Do you prefer to save your money in the bank or to **risk** losing it by investing?"},{"id":"verb-gerund-1-12","t":"How difficult is it to **quit** smoking?"},{"id":"verb-gerund-1-13","t":"When something is difficult, do you **keep** trying or do you **give up**?"},{"id":"verb-gerund-1-14","t":"You are supposed to meet someone for a date, but they **postpone** several times. What do you think?"},{"id":"verb-gerund-1-15","t":"Can you **admit** making a mistake? Or do you try to **deny** the truth?"}],"instr":"When some verbs are followed by a verb, we use the gerund form (-ing). Try to answer each question using the verb in bold followed by the -ing form of another verb. Try to continue each conversation naturally."}],"instr":"When some verbs are followed by a verb, we use the gerund form (-ing). Try to answer each question using the verb in bold followed by the -ing form of another verb. Try to continue each conversation naturally.","formulas":["[verb] + [verb]-ing"],"examples":[]},{"id":"verb-infinitive","cat":"patterns","emoji":"➡️","title":"Verb + Infinitive","ru":"Глаголы, после которых нужен to + глагол: decide, plan, hope…","sets":[{"label":"Набор 1","q":[{"id":"verb-infinitive-1-1","t":"Have you **decided** what to do this weekend?"},{"id":"verb-infinitive-1-2","t":"How much would you **offer** to pay me to sing for you?"},{"id":"verb-infinitive-1-3","t":"Would you **agree** or **refuse** to bungy jump if I paid for it?"},{"id":"verb-infinitive-1-4","t":"What are you **planning** to do next year?"},{"id":"verb-infinitive-1-5","t":"Most people can't **afford** to do what?"},{"id":"verb-infinitive-1-6","t":"Someone **threatened** to hurt me! What should I do?"},{"id":"verb-infinitive-1-7","t":"What do you **need** to do to get better at English?"},{"id":"verb-infinitive-1-8","t":"Have you gone on vacation and realized that you **failed** to bring something important? What was it?"},{"id":"verb-infinitive-1-9","t":"What did you **forget** to do recently?"},{"id":"verb-infinitive-1-10","t":"What would you like to **learn** to do?"},{"id":"verb-infinitive-1-11","t":"What do you **tend** to do when you are hungry?"},{"id":"verb-infinitive-1-12","t":"It could be fun to **pretend** to be someone else. Who would you **pretend** to be?"},{"id":"verb-infinitive-1-13","t":"Can you **promise** to always be honest?"},{"id":"verb-infinitive-1-14","t":"What would you **expect** to see if you went to New York City?"},{"id":"verb-infinitive-1-15","t":"What is something that you **hope** to do in your life?"}],"instr":"When some verbs are followed by a verb, we use the infinitive form (to ~). Try to answer each question using the verb in bold followed by the infinitive form of another verb. Then try to continue each conversation naturally."}],"instr":"When some verbs are followed by a verb, we use the infinitive form (to ~). Try to answer each question using the verb in bold followed by the infinitive form of another verb. Then try to continue each conversation naturally.","formulas":["[verb] + to + [verb]"],"examples":[]},{"id":"preposition-gerund","cat":"patterns","emoji":"🔗","title":"Preposition + Gerund","ru":"После предлога — форма -ing: interested in doing…","sets":[{"label":"Набор 1","q":[{"id":"preposition-gerund-1-1","t":"In your home, who is **responsible for** doing the housework?"},{"id":"preposition-gerund-1-2","t":"What do you **plan on** doing tonight?"},{"id":"preposition-gerund-1-3","t":"Where are you **looking forward to** going in the future?"},{"id":"preposition-gerund-1-4","t":"What are you **interested in** doing when you visit a new city or country?"},{"id":"preposition-gerund-1-5","t":"Are you **afraid of** doing something? What is it?"},{"id":"preposition-gerund-1-6","t":"What do you **dream of** doing?"},{"id":"preposition-gerund-1-7","t":"What have you **apologized for** doing or not doing lately?"},{"id":"preposition-gerund-1-8","t":"What can't you **forgive someone for** doing?"},{"id":"preposition-gerund-1-9","t":"Are you **excited about** doing something soon?"},{"id":"preposition-gerund-1-10","t":"Are you **in favor of** changing any laws? Which laws?"},{"id":"preposition-gerund-1-11","t":"If a criminal **confesses to** doing a crime, should we punish them less?"},{"id":"preposition-gerund-1-12","t":"Is there something that was difficult at first, but now you are **used to** doing?"},{"id":"preposition-gerund-1-13","t":"We are going to have a party. Which part would you like to be **in charge of** organizing?"},{"id":"preposition-gerund-1-14","t":"How do you **concentrate on** doing something? Do you have any strategies?"},{"id":"preposition-gerund-1-15","t":"Do you **have an excuse for** sleeping in class? What is it?"}],"instr":""}],"instr":"The following questions have prepositions that can be followed by a gerund. Try to answer using the phrase in bold with its preposition and the -ing form of a verb. Then try to continue each conversation naturally.","formulas":["[preposition] + [verb]-ing"],"examples":[]},{"id":"suggest-recommend","cat":"patterns","emoji":"💡","title":"Suggest & Recommend","ru":"Сослагательное наклонение: I suggest he study…","sets":[{"label":"Набор 1","q":[{"id":"suggest-recommend-1-1","t":"My brother is choosing his major at university. What should he study?"},{"id":"suggest-recommend-1-2","t":"Susan wants to open a cafe. Where should it be located?"},{"id":"suggest-recommend-1-3","t":"Let's go out for a drink. Do you know a place nearby?"},{"id":"suggest-recommend-1-4","t":"I want to get a computer. Do you have any recommendations?"},{"id":"suggest-recommend-1-5","t":"My parents want to go somewhere in Europe. Where do you think they should go?"},{"id":"suggest-recommend-1-6","t":"My grandmother wants to know where she can get accurate news online. Do you have any ideas?"},{"id":"suggest-recommend-1-7","t":"There are lots of mosquitos in our house these days. They're so annoying."},{"id":"suggest-recommend-1-8","t":"We bought a boat. What should it be called?"},{"id":"suggest-recommend-1-9","t":"A local company wants to expand into a foreign market. Can you think of a business-friendly country?"},{"id":"suggest-recommend-1-10","t":"Antonio wants to buy some new clothes. Where should he go shopping?"},{"id":"suggest-recommend-1-11","t":"I work late and I find it hard to get to sleep. Got any ideas?"},{"id":"suggest-recommend-1-12","t":"My friend asked me for a bingeable TV show. What can I tell her?"},{"id":"suggest-recommend-1-13","t":"How about we bake something with the new oven? What should we bake?"},{"id":"suggest-recommend-1-14","t":"A couple that I know is going to the United States. Can you suggest any cities or sights they should visit?"},{"id":"suggest-recommend-1-15","t":"Gilberto wants to live a very long time. How can he do that?"},{"id":"suggest-recommend-1-16","t":"What's a good way that I can save money?"}],"instr":""}],"instr":"Use this pattern with suggest and recommend and then continue your conversation naturally:","formulas":["I + **suggest/recommend** + (that) + [subject] + [base verb]"],"examples":["I suggest he study political science.","I recommend he get an Apple MacBook."]},{"id":"nouns-countable","cat":"nouns","emoji":"🍎","title":"Countable & Uncountable Nouns","ru":"Исчисляемые и неисчисляемые существительные: much, many, some, any","sets":[{"label":"Набор 1","instr":"","q":[{"id":"nouns-countable-1-1","t":"**How much** water do you drink in a day?"},{"id":"nouns-countable-1-2","t":"What kinds of **food** do you eat regularly?"},{"id":"nouns-countable-1-3","t":"What did you order last time you went to a restaurant?"},{"id":"nouns-countable-1-4","t":"Do you eat **any** special foods on New Year's Day? If so, what do you eat?"},{"id":"nouns-countable-1-5","t":"What are **some** of your favorite types of vegetables?"},{"id":"nouns-countable-1-6","t":"What's your favorite type of **meat**? Why is it better than other types?"},{"id":"nouns-countable-1-7","t":"What would you like to grow if you had a garden?"},{"id":"nouns-countable-1-8","t":"What types of **ingredients** go into your favorite dish?"},{"id":"nouns-countable-1-9","t":"What are **some** unhealthy foods that you love?"},{"id":"nouns-countable-1-10","t":"What **spices** do you use most when you cook?"},{"id":"nouns-countable-1-11","t":"What do you usually order when you go to your favorite fast **food** restaurant?"},{"id":"nouns-countable-1-12","t":"What do you eat when you go to watch a movie?"},{"id":"nouns-countable-1-13","t":"Do you prefer eating **utensils** made from wood, metal, or plastic?"},{"id":"nouns-countable-1-14","t":"What's your favorite fruit? **How much** do you usually eat in one sitting?"},{"id":"nouns-countable-1-15","t":"What **drink** do you like to have with **meals**?"},{"id":"nouns-countable-1-16","t":"What kind of condiments do you use **a lot**? What types of food do you put them on?"},{"id":"nouns-countable-1-17","t":"What do you eat when it's cold outside?"}]}],"instr":"Answer each question in full sentences. Pay attention to countable and uncountable nouns: use a/an, some, any, much, many, a lot of, a few and a little correctly.","formulas":["How many + [countable noun]-s?  ·  How much + [uncountable noun]?","a few / many + [countable]  ·  a little / much + [uncountable]","some / any / a lot of + [both]"],"examples":["I drink a lot of water — about two litres a day.","I eat a few apples and a little cheese every day."]},{"id":"comparatives","cat":"adj","emoji":"📏","title":"Comparatives","ru":"Сравнительная степень: bigger than, more interesting than","sets":[{"label":"Набор 1","q":[{"id":"comparatives-1-1","t":"Which countries are **bigger than** the United States?"},{"id":"comparatives-1-2","t":"Which countries have **larger** populations **than** the one we are in now?"},{"id":"comparatives-1-3","t":"Which of these cities is **closer** to here: Paris, New York, or Moscow?"},{"id":"comparatives-1-4","t":"What are some foods that are **healthier than** bread?"},{"id":"comparatives-1-5","t":"Which of these is **better** for your health: eating healthy or working out?"},{"id":"comparatives-1-6","t":"Are there many foods that are **spicier than** curry? What are they?"},{"id":"comparatives-1-7","t":"Which drinks are **sweeter than** fruit juice?"},{"id":"comparatives-1-8","t":"What's **saltier**, potato chips or pretzels?"},{"id":"comparatives-1-9","t":"What materials are **harder than** wood?"},{"id":"comparatives-1-10","t":"Who is **taller than** you in your family?"},{"id":"comparatives-1-11","t":"Has anyone been **kinder** to you **than** your own family?"},{"id":"comparatives-1-12","t":"Who might be **smarter than** you in this room?"},{"id":"comparatives-1-13","t":"Who is **faster** at answering these questions **than** you?"},{"id":"comparatives-1-14","t":"Which color is **more fashionable than** others this year?"},{"id":"comparatives-1-15","t":"Which animal looks **stranger** - the elephant or the giraffe?"},{"id":"comparatives-1-16","t":"Could you run **faster than** a cow?"},{"id":"comparatives-1-17","t":"What's **more dangerous than** a gun?"},{"id":"comparatives-1- at is **the most popular** sport in your country? Do you like to play it?"},{"id":"superlatives-2-22","t":"Who do you think is **the most powerful** person on earth?"},{"id":"superlatives-2-23","t":"What is **the farthest** you have ever been from home?"},{"id":"superlatives-2-24","t":"What is **the most dangerous** job in the world? Would you do this job?"}],"instr":""}],"instr":"Answer each question and continue your conversation naturally.","formulas":["the + [adjective]-est","the most + [adjective]"],"examples":[]},{"id":"adverbs-of-manner","cat":"adj","emoji":"🐢","title":"Adverbs of Manner","ru":"Как выполняется действие: slowly, carefully, well","sets":[{"label":"Набор 1","q":[{"id":"adverbs-of-manner-1-1","t":"What is a food that you like to eat very **slowly**? Why is it that you do this?"},{"id":"adverbs-of-manner-1-2","t":"What things do you do very **carefully**? Why are you so careful when doing them?"},{"id":"adverbs-of-manner-1-3","t":"Which animal would you say moves the most **gracefully**? Where have you seen one?"},{"id":"adverbs-of-manner-1-4","t":"What is something that you think you do **well**? What kinds of things do you do **badly**?"},{"id":"adverbs-of-manner-1-5","t":"Do you know anyone who can speak more than 1 language **fluently**? Which languages?"},{"id":"adverbs-of-manner-1-6","t":"What is a game or sport that you play or do **enthusiastically**? How is it played?"},{"id":"adverbs-of-manner-1-7","t":"Who is someone you know that does things very **skillfully**? What things can they do?"},{"id":"adverbs-of-manner-1-8","t":"What kinds of activities require people to wait **patiently** or **silently**?"},{"id":"adverbs-of-manner-1-9","t":"Would you say that people in your country act **politely** to strangers? Why so?"},{"id":"adverbs-of-manner-1-10","t":"Are you able to speak **confidently** in front of a large crowd? When did you last do this?"},{"id":"adverbs-of-manner-1-11","t":"Have you ever broken something **deliberately**? What did you break and why?"},{"id":"adverbs-of-manner-1-12","t":"When was the last time that you dressed **formally**? What was the occasion?"},{"id":"adverbs-of-manner-1-13","t":"What are some activities that you enjoy doing **quietly**? Do you do these things alone?"},{"id":"adverbs-of-manner-1-14","t":"Is there something that you are **gradually** trying to improve? What is it?"},{"id":"adverbs-of-manner-1-15","t":"Have you ever given advice to help a person do something **correctly**? What was it?"},{"id":"adverbs-of-manner-1-16","t":"What is a mistake you have made **repeatedly**? How can you learn not to do this again?"},{"id":"adverbs-of-manner-1-17","t":"Can you think of a decision that you believe you made very **wisely**? What was it?"},{"id":"adverbs-of-manner-1-18","t":"How do you feel about people who eat **noisily**? Is this acceptable in your culture?"},{"id":"adverbs-of-manner-1-19","t":"When did a person last behave **kindly** to you? What was it that they did or said?"},{"id":"adverbs-of-manner-1-20","t":"What is something that you have done **successfully** and are very proud of?"},{"id":"adverbs-of-manner-1-21","t":"Do you always answer questions **truthfully**, or do you sometimes tell small lies?"},{"id":"adverbs-of-manner-1-22","t":"What things is your country **historically** well-known for? Do you like these things?"},{"id":"adverbs-of-manner-1-23","t":"Have you ever seen someone acting **suspiciously** in your neighborhood? How so?"},{"id":"adverbs-of-manner-1-24","t":"What are some jobs that require people to work very **precisely** or **accurately**?"},{"id":"adverbs-of-manner-1-25","t":"Do you think that you could teach a dog to behave **obediently**? How would you do it?"}],"instr":""}],"instr":"Answer the following questions using adverbs of manner (slowly, carefully, well, badly…). Explain how and why.","formulas":["[verb] + [adjective]-ly"],"examples":[]},{"id":"linking-words","cat":"linking","emoji":"🧩","title":"Linking Words","ru":"Связки: also, however, because, for example…","sets":[{"label":"Набор 1","q":[{"id":"linking-words-1-1","t":"What do you usually do on weekends? Add another activity with **also**.","sec":"ADDING INFORMATION"},{"id":"linking-words-1-2","t":"Tell me about your favorite foods. Add an extra food with **too**.","sec":"ADDING INFORMATION"},{"id":"linking-words-1-3","t":"Describe your morning routine. Add one more step with **in addition**.","sec":"ADDING INFORMATION"},{"id":"linking-words-1-4","t":"Talk about your town or city: say something good **but** also something bad.","sec":"CONTRASTING IDEAS"},{"id":"linking-words-1-5","t":"Compare studying at home and in a café. Use **however** or **on the other hand**.","sec":"CONTRASTING IDEAS"},{"id":"linking-words-1-6","t":"Describe someone that you have mixed feelings about. Use **although** or **even though**.","sec":"CONTRASTING IDEAS"},{"id":"linking-words-1-7","t":"Talk about a product you like. Say why it isn't perfect with **yet**.","sec":"CONTRASTING IDEAS"},{"id":"linking-words-1-8","t":"Talk about your major or hobby. Why did you choose it? Explain with **because**.","sec":"CAUSE & EFFECT"},{"id":"linking-words-1-9","t":"Talk about a time you were late. End your answer with **that's why**.","sec":"CAUSE & EFFECT"},{"id":"linking-words-1-10","t":"Describe a change you made (think about habits, diet, or plans). Explain the result with **so** or **therefore**.","sec":"CAUSE & EFFECT"},{"id":"linking-words-1-11","t":"What do you do **so that** you can relax after school or work?","sec":"CAUSE & EFFECT"},{"id":"linking-words-1-12","t":"What apps do you use every day? What do you do with them? Give two with **for example**.","sec":"GIVING EXAMPLES"},{"id":"linking-words-1-13","t":"What do people eat in your country? Use **such as** to show some examples.","sec":"GIVING EXAMPLES"},{"id":"linking-words-1-14","t":"What clothes are popular now? Talk about some with **for instance**.","sec":"GIVING EXAMPLES"}],"instr":""},{"label const VOICES = [
  {id:'af_heart', flag:'🇺🇸', name:'Heart', desc:'Американский английский, женский голос'}
];
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const plain = s=>s.replace(/\*\*/g,'');
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return n+' '+(m==1&&h!=11?a:(m>=2&&m<=4&&(h<10||h>=20)?b:c));};
const store={get(k,d){try{const v=localStorage.getItem('ogd:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('ogd:'+k,JSON.stringify(v))}catch(e){}}};

const S = {
  voice: 'af_heart',
  rate: store.get('rate',1),
  hideText: store.get('hideText2',true),
  autoRec: store.get('autoRec',false),
  pause: store.get('pause',20),
  done: new Set(store.get('done',[])),
  view: store.get('view','card'),
};
const saveDone=()=>store.set('done',[...S.done]);
const ALLQ = DATA.topics.flatMap(t=>t.sets.flatMap(s=>s.q.map(q=>q.id)));

/* ---------- audio ---------- */
window.__AUDIO_PACKS = window.__AUDIO_PACKS || {};
window.__AUDIO = (voice,topic,map)=>{ (window.__AUDIO_PACKS[voice]||(window.__AUDIO_PACKS[voice]={}))[topic]=map; };
const packLoads={};
function loadPack(voice,topic){
  if(voice==='browser') return Promise.reject();
  const key=voice+'/'+topic;
  if(window.__AUDIO_PACKS[voice]&&window.__AUDIO_PACKS[voice][topic]) return Promise.resolve(window.__AUDIO_PACKS[voice][topic]);
  if(packLoads[key]) return packLoads[key];
  packLoads[key]=new Promise((res,rej)=>{
    const sc=document.createElement('script'); sc.src='audio/'+voice+'/'+topic+'.js';
    sc.onload=()=>{const p=window.__AUDIO_PACKS[voice]&&window.__AUDIO_PACKS[voice][topic]; p?res(p):rej();};
    sc.onerror=()=>{delete packLoads[key];rej();};
    document.head.appendChild(sc);
  });
  return packLoads[key];
}
const player=new Audio(); player.preload='auto';
let speakToken=0;
function pickBrowserVoice(){
  if(!('speechSynthesis' in window)) return null;
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const pref=[/natural/i,/neural/i,/Google US English/i,/Samantha/i,/Ava|Allison|Aria|Jenny/i,/Google UK English Female/i,/Daniel|Serena|Kate/i];
  for(const r of pref){const v=vs.find(v=>r.test(v.name)); if(v) return v;}
  return vs.find(v=>/en-US/i.test(v.lang))||vs[0]||null;
}
function stopSpeech(){speakToken++; try{player.pause()}catch(e){} if('speechSynthesis' in window) speechSynthesis.cancel(); setPlaying(false);}
function speak(topicId,q,rateMul=1){
  stopSpeech(); const my=++speakToken; setPlaying(true);
  return new Promise(resolve=>{
    const finish=()=>{ if(my===speakToken) setPlaying(false); resolve(); };
    const browser=()=>{
      if(!('speechSynthesis' in window)){toast('Озвучка недоступна в этом браузере');finish();return;}
      const u=new SpeechSynthesisUtterance(plain(q.t).replace(/\//g,' or '));
      const v=pickBrowserVoice(); if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';
      u.rate=0.95*S.rate*rateMul; u.onend=finish; u.onerror=finish; speechSynthesis.speak(u);
    };
    loadPack(S.voice,topicId).then(pack=>{
      if(my!==speakToken) return resolve();
      const src=pack[q.id]; if(!src){browser();return;}
      player.src=src; player.playbackRate=S.rate*rateMul; player.preservesPitch=true;
      player.onended=finish; player.onerror=()=>browser();
      player.play().catch(()=>browser());
    }).catch(()=>{ if(my!==speakToken) return resolve(); if(S.voice!=='browser'&&!speak._warned){speak._warned=1;toast('Файлы озвучки не найдены — играет голос устройства');} browser(); });
  });
}
function setPlaying(on){ document.querySelectorAll('[data-play-main]').forEach(b=>b.classList.toggle('playing',on)); }

/* ---------- recording ---------- */
const R={rec:null,chunks:[],url:null,qid:null,stream:null,startedAt:0,tick:null};
async function startRec(qid){
  const inApp=/VKClient|vkclient|Telegram|FBAN|FBAV|Instagram/i.test(navigator.userAgent), ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  const iosOther=ios&&!inApp&&/CriOS|YaBrowser|EdgiOS|FxiOS|OPiOS|YaApp/i.test(navigator.userAgent);
  const IOS_OTHER='На iPhone запись надёжнее всего работает в Safari — открой эту страницу в Safari. Если хочешь остаться в этом браузере: Настройки iPhone → найди этот браузер (Chrome или Яндекс) → включи «Микрофон» и попробуй ещё раз.';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){recNote(iosOther?IOS_OTHER:inApp?'Запись недоступна во встроенном браузере ВКонтакте или Telegram. Открой страницу в Safari или Chrome.':'Запись не поддерживается этим браузером. Открой страницу в Safari или Chrome.',true);return false;}
  try{ R.stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ const n=e&&e.name; recNote(iosOther?IOS_OTHER:inApp?'Запись недоступна во встроенном браузере ВКонтакте или Telegram. Открой страницу в Safari или Chrome.'
      : n==='NotFoundError'?'Микрофон не найден. Подключи наушники с микрофоном или проверь настройки звука.'
      : ios?'Нет доступа к микрофону. Нажми «аА» в адресной строке Safari → «Настройки веб-сайта» → «Микрофон» → «Разрешить» и попробуй ещё раз.'
      :'Нет доступа к микрофону. Нажми на значок замка в адресной строке, разреши микрофон для этого сайта и попробуй ещё раз.',true); return false; }
  R.chunks=[]; R.qid=qid; R.rec=new MediaRecorder(R.stream);
  R.rec.ondataavailable=e=>e.data.size&&R.chunks.push(e.data);

}

    if(el.dataset.show){ shown.add(el.dataset.show); renderDrill(); return;}
    if(el.dataset.say!=null){ speak(cur.topic.id,curSet().q[+el.dataset.say]); return;}
    if(el.dataset.p){ S.pause=+el.dataset.p; store.set('pause',S.pause); app.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.p===S.pause)); return;}
    switch(el.id){
      case 'playBtn': speak(cur.topic.id,curQ()); break;
      case 'slowBtn': speak(cur.topic.id,curQ(),0.8); break;
      case 'revealBtn': reveal=true; renderDrill(); break;
      case 'recBtn': R.rec?stopRec():(stopSpeech(),startRec(curQ().id)); break;
      case 'doneBtn': toggleDone(); break;
      case 'prevBtn': go(cur.idx-1); break;
      case 'nextBtn': go(cur.idx+1); break;
      case 'autoBtn': AUTO.on?stopAuto():startAuto(); break;
    }
  };
  app.onchange=e=>{ if(e.target.id==='autoRecChk'){S.autoRec=e.target.checked;store.set('autoRec',S.autoRec);} };
}
function toggleDone(force){
  const q=curQ(); const on=force!=null?force:!S.done.has(q.id);
  on?S.done.add(q.id):S.done.delete(q.id); saveDone(); updateProgress();
  if(force==null) renderDrill();
}
function go(i){ const st=curSet(); if(i<0||i>=st.q.length) return; stopSpeech(); stopRec(); if(!AUTO.on) {} cur.idx=i; reveal=false; renderDrill(); if(S.hideText&&!AUTO.on) speak(cur.topic.id,curQ()); const qc=$('.qcard'); if(qc&&qc.getBoundingClientRect().top<60) qc.scrollIntoView({block:'start',behavior:'smooth'}); }

/* ---------- auto run ---------- */
const AUTO={on:false,token:0,raf:null};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function startAuto(){
  if(S.view!=='card'){S.view='card';store.set('view','card');}
  AUTO.on=true; const my=++AUTO.token; renderDrill();
  while(AUTO.on&&my===AUTO.token){
    const q=curQ();
    await speak(cur.topic.id,q); if(!AUTO.on||my!==AUTO.token) break;
    await wait(300);
    if(S.autoRec) await startRec(q.id);
    const total=S.pause*1000, t0=Date.now();
    await new Promise(res=>{ const step=()=>{ if(!AUTO.on||my!==AUTO.token) return res(); const el=Date.now()-t0; const bar=$('#autoBar'), cd=$('#autoCd');
        if(bar) bar.style.width=Math.min(100,100*el/total)+'%'; if(cd) cd.textContent='Отвечай: '+Math.max(0,Math.ceil((total-el)/1000))+' с';
        if(el>=total) return res(); AUTO.raf=requestAnimationFrame(step); }; step(); });
    if(!AUTO.on||my!==AUTO.token) break;
    if(S.autoRec) { stopRec(); await wait(400); }
    toggleDone(true);
    if(cur.idx>=curSet().q.length-1){ stopAuto(); toast('Набор пройден!'); renderDrill(); break; }
    cur.idx++; reveal=false; renderDrill();
  }
}
function stopAuto(){ if(!AUTO.on) return; AUTO.on=false; AUTO.token++; cancelAnimationFrame(AUTO.raf); stopSpeech(); stopRec(); const b=$('#autoBtn'); if(b){b.textContent='▶ Начать с текущего';} const cd=$('#autoCd'); if(cd) cd.textContent=''; const bar=$('#autoBar'); if(bar) bar.style.width='0'; }

/* ---------- keyboard & history ---------- */
document.addEventListener('keydown',e=>{
  if(!cur.topic||$('#dlgRoot').firstChild||e.target.closest('input,select,textarea')||e.metaKey||e.ctrlKey||e.altKey) return;
  if(S.view!=='card') return;
  if(e.key===' '){e.preventDefault(); speak(cur.topic.id,curQ());}
  else if(e.key==='ArrowRight'){go(cur.idx+1);}
  else if(e.key==='ArrowLeft'){go(cur.idx-1);}
  else if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К'){ R.rec?stopRec():(stopSpeech(),startRec(curQ().id)); }
  else if(e.key==='Enter'&&!e.target.closest('button')){toggleDone();}
});
window.addEventListener('popstate',()=>{ const id=location.hash.slice(1); id&&DATA.topics.some(t=>t.id===id)?openTopic(id,false):renderHome(); });
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};

const startId=location.hash.slice(1);
if(startId&&DATA.topics.some(t=>t.id===startId)) openTopic(startId,false); else renderHome();
updateProgress();
</script>
